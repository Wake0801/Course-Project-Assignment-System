<!DOCTYPE html>
<html lang="zxx" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="description" content="Orbitor,business,company,agency,modern,bootstrap4,tech,software">
  <meta name="author" content="themefisher.com">

  <title>Quản lý đề tài</title>
  <th:block th:replace="~{client/layout/header :: headContent}"></th:block>
  <style>
        .status-badge {
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .modal {
            transition: opacity 0.3s ease-in-out;
        }
        .fade-in {
            animation: fadeIn 0.3s;
        }
        .fade-out {
            animation: fadeOut 0.3s;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeOut {
            from { opacity: 1; transform: translateY(0); }
            to { opacity: 0; transform: translateY(-20px); }
        }
        .grade {
            background: linear-gradient(90deg, #3b82f6, #8b5cf6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: bold;
        }
    </style>
</head>

<body id="top">
<div th:replace="~{client/layout/header :: header}"></div>

 <div class="container mx-auto px-4 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Đề tài của tôi</h1>
            <div class="relative">
                <div class="h-10 w-10 rounded-full bg-blue-500 flex items-center justify-center text-white font-bold cursor-pointer hover:bg-blue-600 transition">
                    <span>SV</span>
                </div>
            </div>
        </div>

        <!-- Filter section -->
        <div class="bg-white rounded-lg shadow p-6 mb-8">
            <h2 class="text-xl font-semibold text-gray-700 mb-4">Bộ lọc</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label for="credit-class" class="block text-sm font-medium text-gray-700 mb-1">Lớp tín chỉ</label>
                    <select id="credit-class" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Tất cả lớp tín chỉ</option>
                        <option th:each="lop : ${lopTinChis}" 
                                th:value="${lop.maLopTC}" 
                                th:text="${lop.tenMon + ' - ' + lop.maLopTC}"></option>
                    </select>
                </div>
                <div>
                    <label for="status" class="block text-sm font-medium text-gray-700 mb-1">Trạng thái</label>
                    <select id="status" class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-blue-500 focus:border-blue-500">
                        <option value="">Tất cả trạng thái</option>
                        <option value="progress">Đang thực hiện</option>
                        <option value="completed">Đã hoàn thành</option>
                    </select>
                </div>
                <div class="flex items-end">
                    <button id="apply-filters" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md transition w-full">
                        Áp dụng bộ lọc
                    </button>
                </div>
            </div>
        </div>

        <!-- Projects list -->
        <div id="projects-list" class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div th:each="deTai : ${deTais}" class="bg-white rounded-lg shadow hover:shadow-md transition overflow-hidden">
                <div class="p-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <h3 class="text-lg font-semibold text-gray-800" th:text="${deTai.tenDT}"></h3>
                            <p class="text-sm text-gray-500 mt-1" th:text="${deTai.lopTinChi.tenMon + ' - ' + deTai.lopTinChi.maLopTC}"></p>
                        </div>
                        <span th:class="${deTai.completed ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}" 
                            class="status-badge">
                            <span th:text="${deTai.completed ? 'Đã hoàn thành' : 'Đang làm'}"></span>
                        </span>
                    </div>
                    
                    <div class="mt-4 pt-4 border-t border-gray-100">
                        <div class="flex justify-between items-center">
                            <div>
                                <p class="text-sm text-gray-500">Nhóm:</p>
                                <p class="text-sm font-medium" th:text="${deTai.nhom.tenNhom}"></p>
                            </div>
                            <div class="text-right">
                                <p class="text-sm text-gray-500">Điểm hiện tại:</p>
                                <p class="grade" th:text="${deTai.diemTrungBinh} + '/10'"></p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-5">
                        <a th:href="@{/client/sv/deTai/detail?maDT={maDT}&maNhom={maNhom}(maDT=${deTai.maDT},maNhom=${deTai.nhom.maNhom})}" 
                        class="view-detail-btn w-full py-2 px-4 border border-blue-500 rounded-md text-blue-600 hover:bg-blue-50 transition flex items-center justify-center">
                            <i class="fas fa-info-circle mr-2"></i> Xem chi tiết
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Project detail modal -->
    <div id="project-modal" class="fixed inset-0 z-50 flex items-center justify-center hidden">
        <div class="absolute inset-0 bg-black bg-opacity-50" onclick="closeModal()"></div>
        
        <div class="modal-container bg-white w-full max-w-4xl mx-4 rounded-lg shadow-xl z-50 overflow-y-auto max-h-screen fade-in" id="modal-content">
            <!-- Content will be loaded here via JavaScript -->
        </div>
    </div>
    <script>
        document.getElementById('apply-filters').addEventListener('click', function () {
        const creditClass = document.getElementById('credit-class').value;
        const status = document.getElementById('status').value;

        const queryParams = new URLSearchParams();
        if (creditClass) queryParams.append("maLopTC", creditClass);
        if (status === 'progress' || status === 'completed') queryParams.append("trangThai", status);

        window.location.href = `/client/sv/deTai?${queryParams.toString()}`;
    });

    </script>

<!-- footer Start -->
<div th:replace="~{client/layout/footer :: footer}"></div>
<th:block th:replace="~{client/layout/footer :: scriptContent}"></th:block>
<script th:src="@{client/js/studentgroup.js}"></script>
</body>
</html>
