<!DOCTYPE html>
<html lang="zxx">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="description" content="Orbitor,business,company,agency,modern,bootstrap4,tech,software">
  <meta name="author" content="themefisher.com">

  <title>Quản lý đề tài</title>
  <th:block th:replace="~{client/layout/header :: headContent}"></th:block>
</head>
<body id="top">
<div th:replace="~{client/layout/header :: header}"></div>

<div class="container mt-4">
        <h2 class="mb-4">Danh sách sinh viên theo lớp tín chỉ</h2>
        
        <!-- Form lọc -->
        <div class="card mb-4">
            <div class="card-header bg-primary text-white">
                <h5>Lọc dữ liệu</h5>
            </div>
            <div class="card-body">
                <form th:action="@{/client/gv/studentList}" method="get">
                    <div class="row">
                        <div class="col-md-6">
                            <label for="maLopTC" class="form-label">Chọn lớp tín chỉ</label>
                            <select class="form-select" id="maLopTC" name="maLopTC">
                                <option value="">-- Chọn lớp tín chỉ --</option>
                                <option th:each="ltc : ${dsLopTinChi}" 
                                        th:value="${ltc.maLopTC}" 
                                        th:text="${ltc.maLopTC + ' - ' + ltc.monHoc.tenMon}"
                                        th:selected="${maLopTC != null && maLopTC == ltc.maLopTC}">
                                </option>
                            </select>
                        </div>
                        <div class="col-md-2 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary">Lọc</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

        <!-- Hiển thị thông tin lớp tín chỉ đang chọn -->
        <div th:if="${selectedLopTC != null}" class="alert alert-info mb-4">
            <h5>Thông tin lớp tín chỉ: <span th:text="${selectedLopTC.maLopTC}"></span></h5>
            <p>
                Môn học: <span th:text="${selectedLopTC.monHoc.tenMon}"></span><br>
                Giảng viên: <span th:text="${selectedLopTC.giangVien.ho + ' ' + selectedLopTC.giangVien.ten}"></span><br>
                Số sinh viên: <span th:text="${sinhVienPage.totalElements}"></span>
            </p>
        </div>

        <!-- Bảng danh sách sinh viên -->
        <div th:if="${sinhVienPage != null && !sinhVienPage.isEmpty()}" class="card">
            <div class="card-header bg-success text-white">
                <h5>Danh sách sinh viên</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped table-hover">
                        <thead>
                            <tr>
                                <th>STT</th>
                                <th>Mã SV</th>
                                <th>Họ và tên</th>
                                <th>Giới tính</th>
                                <th>Email</th>
                                <th>Số điện thoại</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="sv, iter : ${sinhVienPage.content}">
                                <td th:text="${iter.index + 1 + (sinhVienPage.number * sinhVienPage.size)}"></td>
                                <td th:text="${sv.maSV}"></td>
                                <td th:text="${sv.ho + ' ' + sv.ten}"></td>
                                <td th:text="${sv.gioiTinh ? 'Nam' : 'Nữ'}"></td>
                                <td th:text="${sv.email}"></td>
                                <td th:text="${sv.soDT}"></td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Phân trang -->
                <div th:if="${sinhVienPage.totalPages > 1}" class="mt-3">
                    <nav aria-label="Page navigation">
                        <ul class="pagination">
                            <li class="page-item" th:classappend="${sinhVienPage.number == 0} ? 'disabled'">
                                <a class="page-link" th:href="@{/client/gv/studentList(maLopTC=${maLopTC}, page=${sinhVienPage.number - 1})}">Trước</a>
                            </li>
                            <li th:each="i : ${#numbers.sequence(1, sinhVienPage.totalPages)}" 
                                class="page-item" th:classappend="${i - 1 == sinhVienPage.number} ? 'active'">
                                <a class="page-link" th:href="@{/client/gv/studentList(maLopTC=${maLopTC}, page=${i - 1})}" th:text="${i}"></a>
                            </li>
                            <li class="page-item" th:classappend="${sinhVienPage.number + 1 == sinhVienPage.totalPages} ? 'disabled'">
                                <a class="page-link" th:href="@{/client/gv/studentList(maLopTC=${maLopTC}, page=${sinhVienPage.number + 1})}">Sau</a>
                            </li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>

        <!-- Thông báo khi không có dữ liệu -->
        <div th:if="${sinhVienPage != null && sinhVienPage.isEmpty()}" class="alert alert-warning">
            Không có sinh viên nào trong lớp tín chỉ này.
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<div th:replace="~{client/layout/footer :: footer}"></div>
<th:block th:replace="~{client/layout/footer :: scriptContent}"></th:block>
    <script th:src="@{client/js/studentlist.js}"></script>
  </body>
  </html>
