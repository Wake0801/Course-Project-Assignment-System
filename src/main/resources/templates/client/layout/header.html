<html lang="zxx" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<th:block th:fragment="headContent">
  <!-- Favicon -->
  <link rel="shortcut icon" type="image/x-icon" th:href="@{/client/images/favicon.ico}" />
  <!-- bootstrap.min css -->
  <link rel="stylesheet" th:href="@{/client/plugins/bootstrap/css/bootstrap.min.css}" />
  <!-- Icon Font Css -->
  <link rel="stylesheet" th:href="@{/client/plugins/icofont/icofont.min.css}"/>
  <!-- Slick Slider  CSS -->
  <link rel="stylesheet" th:href="@{/client/plugins/slick-carousel/slick/slick.css}"/>
  <link rel="stylesheet" th:href="@{/client/plugins/slick-carousel/slick/slick-theme.css}"/>
  <!-- FONT AWESOME -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- CUSTOM CSS SAU CÙNG -->
  <link rel="stylesheet" th:href="@{/client/css/style.css}"/>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</th:block>

<header th:fragment="header">
  <nav class="navbar-expand-lg" id="navbar">
    <div class="collapse navbar-collapse" id="navbarmain">
    <div class="container container1">
      <a class="navbar-brand" href="home.html">
      <img th:src="@{/client/images/z6425388337729_4b57f431a7c60d62672c90a6b28f44ee.jpg}" alt="" class="img-fluid">
      </a>
      <ul class="navbar-nav" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
        
        <!-- Hiển thị với mọi người đã đăng nhập -->
        <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" th:href="@{/client/public/home}">Trang chủ</a>
        </li>

        <!-- Chỉ ADMIN và GIẢNG VIÊN thấy -->
        <li class="nav-item" sec:authorize="hasRole('GIANG_VIEN')">
            <a class="nav-link" th:href="@{/client/gv/topic}">Quản lý đề tài</a>
        </li>

        <!-- Chỉ GIẢNG VIÊN thấy -->
        <li class="nav-item" sec:authorize="hasRole('GIANG_VIEN')">
            <a class="nav-link" th:href="@{/client/public/studentGroup}">Quản lý nhóm</a>
        </li>
        <li class="nav-item" sec:authorize="hasRole('SINH_VIEN')">
            <a class="nav-link" th:href="@{/client/public/studentGroup}">Nhóm</a>
        </li>
        <!-- Chỉ GIẢNG VIÊN thấy -->
        <li class="nav-item" sec:authorize="hasRole('GIANG_VIEN')">
            <a class="nav-link" th:href="@{/client/gv/studentList}">Danh sách sinh viên</a>
        </li>
        <!-- Chỉ SINH VIÊN thấy -->
        <li class="nav-item" sec:authorize="hasRole('SINH_VIEN')">
            <a class="nav-link" th:href="@{/client/sv/deTai}">Đề tài</a>
        </li>

    </ul>

    </div>

      
      <li class="user-info nav-item dropdown">
        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false" style="margin-right:30px">
          <img th:src="@{/client/images/61f75ea9a680def2ed1c6929fe75aeee.jpg}" alt="User">
        </a>
        <div class="dropdown-menu" aria-labelledby="navbarDropdown">
          <a class="dropdown-item" th:href="@{/client/public/userinfo}">Thông tin cá nhân</a>

          <form th:action="@{/logout}" method="post">
            <button type="submit" class="dropdown-item">Đăng xuất</button>
        </form>

      </li>
    </div>
  </nav>
</header>
