<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/other/login.css}" />
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md">
        <div class="bg-white rounded-2xl shadow-xl overflow-hidden">
            <!-- Header Section -->
            <div class="bg-gradient-to-r from-blue-500 to-purple-600 p-6 text-center">
                <div class="logo-wave inline-block">
                    <h1 class="text-3xl font-bold text-white">PTITHCM</h1>
                </div>
                <p class="text-blue-100 mt-2">Học viện công nghệ bưu chính viễn thông<br>Cơ sở tại TPHCM</p>
            </div>
            
            <!-- Login Form -->
            <div class="p-8">
                <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">Cấp lại mật khẩu</h2>
                
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <p>Chúng tôi sẽ gửi mã xác nhận qua email . Bạn vui lòng nhập đúng email để nhận lại mật khẩu</p>
                <form th:action="@{/other/forwardPassword}" th:object="${taiKhoan}" method="post" class="space-y-6">
                    <!-- CSRF Token -->
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    
                    <div>
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1">Nhập email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-user text-gray-400"></i>
                            </div>
                            <input type="text" th:field="*{username}" placeholder="Nhập email" class="input-field pl-10 w-full px-4 py-3 rounded-lg border border-gray-300 focus:outline-none focus:border-indigo-500 transition"/>
                            <div th:if="${#fields.hasErrors('username')}" th:errors="*{username}" class="text-danger"></div>
                        </div>
                    </div>
                    
                    
                    <div class="flex items-center justify-between">
                        <div class="text-sm">
                            <a th:href="@{/other/login}" class="font-medium text-indigo-600 hover:text-indigo-500">
                                Đăng nhập
                            </a>
                        </div>
                    </div>
                    
                    <div>
                        <button type="submit" class="login-btn w-full flex justify-center py-3 px-4 border border-transparent rounded-md shadow-sm text-white font-medium focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            <span id="loginText">Gửi</span>
                            <span id="loginSpinner" class="hidden ml-2">
                                <i class="fas fa-spinner fa-spin"></i>
                            </span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
        
        <div class="mt-6 text-center text-sm text-gray-500">
            © 2025 Nhóm 5 - Bà Xã
        </div>
    </div>
</body>
</html>
