<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Trang admin </title>
    <!-- Favicon icon -->
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/admin/images/favicon.png}" />
    <link rel="stylesheet" th:href="@{/admin/vendor/owl-carousel/css/owl.carousel.min.css}" />
    <link rel="stylesheet" th:href="@{/admin/vendor/owl-carousel/css/owl.theme.default.min.css}" />
    <link th:href="@{/admin/vendor/jqvmap/css/jqvmap.min.css}" rel="stylesheet" />
    <link th:href="@{/admin/css/style.css}" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f2f2f2;
        }
        .content-body {
            padding: 20px;
        }
        button {
            margin: 10px;
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>

</head>

<body>

    <div id="preloader">
        <div class="sk-three-bounce">
            <div class="sk-child sk-bounce1"></div>
            <div class="sk-child sk-bounce2"></div>
            <div class="sk-child sk-bounce3"></div>
        </div>
    </div>
    <!--**********************************
        Main wrapper start
    ***********************************-->
    <div id="main-wrapper">

        <div th:replace="~{admin/layout/header :: header}"></div>
        <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>
        <div class="content-body">
            <div class="container-fluid">
                <div class="flex space-x-4">
                    <!-- Nút Trang chủ -->
                    <form th:action="@{/other/login}" method="get">
                        <button 
                            type="submit" 
                            name="login" 
                            value="login"
                            class="bg-blue-500 hover:bg-blue-600 text-white font-semibold py-2 px-4 rounded shadow"
                        >
                            Trang chủ
                        </button>
                    </form>
                
                    <!-- Nút Show sinh viên -->
                    <form th:action="@{/SinhVien}" method="get">
                        <button 
                            type="submit" 
                            name="SinhVien" 
                            value="SinhVien"
                            class="bg-green-500 hover:bg-green-600 text-white font-semibold py-2 px-4 rounded shadow"
                        >
                            Show sinh viên
                        </button>
                    </form>
                </div>
                
                    <table>
                        <thead>
                            <tr>
                                <th>Mã SV</th>
                                <th>Họ</th>
                                <th>Tên</th>
                                <th>Giới Tính</th>
                                <th>Số ĐT</th>
                                <th>Địa Chỉ</th>
                                <th>Ngày Sinh</th>
                                <th>Email</th>
                                <th>Mã Lớp</th>
                                <th>Mã TK</th>
                            </tr>
                        </thead>
                        <tbody>
                            
                                <tr th:each="sinhVien : ${sinhVienList}">
                                    <td th:text="${sinhVien.maSV}"></td>
                                    <td th:text="${sinhVien.ho}"></td>
                                    <td th:text="${sinhVien.ten}"></td>
                                    <td th:text="${sinhVien.gioiTinh} ? 'Nữ' : 'Nam'"></td>
                                    <td th:text="${sinhVien.soDT}"></td>
                                    <td th:text="${sinhVien.diaChi}"></td>
                                    <td th:text="${sinhVien.ngaySinh}"></td>
                                    <td th:text="${sinhVien.email}"></td>
                                    <td th:text="${sinhVien.lop.maLop}"></td>
                                    <td th:text="${sinhVien.taiKhoan.maTK}"></td>
                                </tr>
                                
                            
                        </tbody>
                    </table>
                
            </div>
        </div>
        <div th:replace="~{admin/layout/footer :: footer}"></div>

    </div>
    <script th:src="@{/admin/vendor/global/global.min.js}"></script>
    <script th:src="@{/admin/js/quixnav-init.js}"></script>
    <script th:src="@{/admin/js/custom.min.js}"></script>

</body>

</html>
