<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý giảng viên</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/admin/images/favicon.png}" />
    <link rel="stylesheet" th:href="@{/admin/vendor/owl-carousel/css/owl.carousel.min.css}" />
    <link rel="stylesheet" th:href="@{/admin/vendor/owl-carousel/css/owl.theme.default.min.css}" />
    <link th:href="@{/admin/vendor/jqvmap/css/jqvmap.min.css}" rel="stylesheet" />
    <link th:href="@{/admin/css/style.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Custom scrollbar for table */
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .layout {
            display: flex;
            min-height: calc(100vh - 5rem); /* Trừ chiều cao header */
            margin-top: 5rem; /* Chiều cao header */
            position: relative;
        }
    </style>
</head>
<body class="bg-gray-50 font-sans">
    <div th:replace="~{admin/layout/header :: header}" id="header-include"></div>
    <div class="layout flex">
        <div th:replace="~{admin/layout/sidebar :: sidebar}" id="sidebar-include"></div>
        <div class="flex-1 ml-[17.1875rem] p-4">
            <div class="container mx-auto px-4 py-8 bg-white rounded-lg shadow-sm">
                <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Quản lý giảng viên</h1>
                
                <!-- Success and Error Messages -->
                <div th:if="${success}" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
                    <span th:text="${error}"></span>
                </div>
                
                <!-- Controls section -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                    <!-- Add button -->
                    <a href="/lecturers/new" id="addBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg shadow-md transition duration-300 flex items-center gap-2">
                        <i class="fas fa-plus"></i>
                        <span>Thêm giảng viên</span>
                    </a>
                    
                    <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                        <!-- Search and Filter form -->
                        <form th:action="@{/lecturers}" method="get" class="flex flex-col md:flex-row gap-3">
                        <!-- Search input -->
                            <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-search text-gray-400"></i>
                                </div>
                                <input type="text" name="search" placeholder="Tìm kiếm theo mã, tên, email..."
                                    th:value="${keyword}" class="pl-10 pr-4 py-2 border rounded-md w-64" />
                            </div>
                            
                            <!-- Filter by Khoa -->
                            <div class="relative">
                                <select name="maKhoa" class="border rounded-md px-3 py-2 text-gray-700 bg-white">
                                    <option value="">-- Tất cả khoa --</option>
                                    <option th:each="khoa : ${listKhoa}" 
                                            th:value="${khoa.maKhoa}"
                                            th:text="${khoa.tenKhoa}"
                                            th:selected="${khoa.maKhoa == selectedKhoa}">
                                    </option>
                                </select>
                            </div>
                            
                            <!-- Search button -->
                            <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition">
                                <i class="fas fa-search mr-1"></i>Tìm kiếm
                            </button>
                            
                            <!-- Clear filter button -->
                            <a href="/lecturers" class="bg-gray-500 text-white px-4 py-2 rounded-md hover:bg-gray-600 transition flex items-center">
                                <i class="fas fa-sync-alt mr-1"></i>Làm mới
                            </a>
                            
                            <!-- Hidden fields to preserve pagination -->
                            <input type="hidden" name="size" th:value="${size}" />
                            </form>
                        
                        <!-- Rows per page selector -->
                        <div class="flex items-center gap-2">
                            <label for="rowsPerPage" class="text-gray-600 whitespace-nowrap">Hiển thị:</label>
                            <form th:action="@{/lecturers}" method="get" class="ml-4">
                                <select name="size" onchange="this.form.submit()" class="border rounded-md px-2 py-1">
                                <option th:selected="${size==10}" value="10">10</option>
                                <option th:selected="${size==30}" value="30">30</option>
                                <option th:selected="${size==50}" value="50">50</option>
                                <option th:selected="${size==100}" value="100">100</option>
                                </select>
                                <!-- Preserve search and filter parameters -->
                                <input type="hidden" name="search" th:value="${keyword}" />
                                <input type="hidden" name="maKhoa" th:value="${selectedKhoa}" />
                            </form>
                        </div>
                    </div>
                </div>
                
                <!-- Filter information -->
                <div class="mb-4 text-sm text-gray-600">
                    <div class="flex flex-wrap items-center gap-4">
                        <!-- Active filters -->
                        <div th:if="${keyword != null and !keyword.isEmpty()}" class="flex items-center bg-blue-100 text-blue-800 px-3 py-1 rounded-full">
                            <i class="fas fa-search mr-1"></i>
                            <span>Từ khóa: "<span th:text="${keyword}"></span>"</span>
                        </div>
                        
                        <div th:if="${selectedKhoa != null and !selectedKhoa.isEmpty()}" class="flex items-center bg-green-100 text-green-800 px-3 py-1 rounded-full">
                            <i class="fas fa-building mr-1"></i>
                            <span>Khoa: <span th:text="${selectedKhoa}"></span></span>
                        </div>
                    </div>
                </div>
                
                <!-- Table container -->
                <div class="table-container overflow-x-auto bg-white rounded-lg shadow-md border border-gray-200">
                    <!-- Hiển thị thông báo khi không có kết quả -->
                    <div th:if="${#lists.isEmpty(ListLecturers)}" class="text-center py-12">
                        <div class="text-gray-500 text-lg mb-4">
                            <i class="fas fa-search text-4xl mb-4 text-gray-400"></i>
                            <div>Không tìm thấy giảng viên nào</div>
                        </div>
                        <div class="text-sm text-gray-400">
                            <span th:if="${keyword != null and !keyword.isEmpty()}">
                                Thử thay đổi từ khóa tìm kiếm hoặc 
                            </span>
                            <span th:if="${selectedKhoa != null and !selectedKhoa.isEmpty()}">
                                thay đổi bộ lọc khoa hoặc 
                            </span>
                            <a href="/lecturers" class="text-blue-600 hover:text-blue-800">xóa tất cả bộ lọc</a>
                        </div>
                    </div>
                    
                    <!-- Hiển thị bảng khi có kết quả -->
                    <table th:if="${!#lists.isEmpty(ListLecturers)}" class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Mã GV</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Họ</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Tên</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Số ĐT</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ngày Sinh</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Học Vị</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Email</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Mã Khoa</th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Mã TK</th>
                                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">Thao tác</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="gv : ${ListLecturers}" class="hover:bg-gray-50">
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${gv.maGV}"></td>
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${gv.ho}"></td>
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${gv.ten}"></td>
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${gv.soDT}"></td>
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${gv.ngaySinh != null} ? ${#temporals.format(gv.ngaySinh, 'dd/MM/yyyy')} : 'N/A'"></td>
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${gv.hocVi}"></td>
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${gv.email}"></td>
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${gv.khoa != null} ? ${gv.khoa.maKhoa} : 'N/A'"></td>
                                <td class="px-6 py-4 text-sm text-gray-900" th:text="${gv.taiKhoan != null} ? ${gv.taiKhoan.maTK} : 'Chưa có TK'"></td>
                                <td class="px-6 py-4 text-right text-sm font-medium">
                                    <a th:href="@{'/lecturers/edit/' + ${gv.maGV}}" class="text-blue-600 hover:text-blue-800 mr-3">Sửa</a>
                                    <a th:href="@{'/lecturers/delete/' + ${gv.maGV}}" onclick="return confirm('Bạn chắc chắn muốn xóa?')" class="text-red-600 hover:text-red-800">Xóa</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination - Chỉ hiển thị khi có kết quả và totalPages > 1 -->
                <div th:if="${totalPages > 1 and !#lists.isEmpty(ListLecturers)}" class="mt-6 flex justify-center gap-2">
                    <a th:each="i : ${#numbers.sequence(1, totalPages)}"
                    th:href="@{|/lecturers?page=${i}&size=${size}&search=${keyword}&maKhoa=${selectedKhoa}|}"
                    th:text="${i}"
                    th:classappend="${i == currentPage} ? 'bg-blue-600 text-white' : 'bg-white text-blue-600'"
                    class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium hover:bg-blue-100 transition">
                    </a>
                                <span th:if="${currentPage == totalPages}" class="page-link">&raquo;&raquo;</span>
                            </li>
                        </ul>
                    </nav>
                </div>
                
            </div>
        </div>
        
        <!-- Modal for Add/Edit -->
        <div id="lecturerModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-2xl">
                <div class="flex justify-between items-center border-b px-6 py-4">
                    <h3 id="modalTitle" class="text-xl font-semibold text-gray-800">Thêm giảng viên</h3>
                    <button id="closeModal" class="text-gray-400 hover:text-gray-500">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="p-6">
                    <form id="lecturerForm" th:action="@{/lecturers/save}" th:object="${editLecturer}" method="post" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <!-- Mã GV -->
                        <div>
                            <label for="maGV" class="block text-sm font-medium text-gray-700 mb-1">Mã GV</label>
                            <input type="text" id="maGV" name="maGV" th:value="${editLecturer?.maGV}" 
                                   th:disabled="${editLecturer?.maGV != null}" required
                                   class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
                            <input type="hidden" name="maGV" th:if="${editLecturer?.maGV != null}" th:value="${editLecturer.maGV}" />
                        </div>
                        
                        <!-- Họ -->
                        <div>
                            <label for="ho" class="block text-sm font-medium text-gray-700 mb-1">Họ</label>
                            <input type="text" id="ho" th:field="*{ho}" required
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
                        </div>
                        
                        <!-- Tên -->
                        <div>
                            <label for="ten" class="block text-sm font-medium text-gray-700 mb-1">Tên</label>
                            <input type="text" id="ten" th:field="*{ten}" required
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
                        </div>
                        
                        <!-- Số ĐT -->
                        <div>
                            <label for="soDT" class="block text-sm font-medium text-gray-700 mb-1">Số điện thoại</label>
                            <input type="text" id="soDT" th:field="*{soDT}"
                                   pattern="^0\d{9}$"
                                   title="Số điện thoại phải bắt đầu bằng số 0 và có đúng 10 chữ số"
                                   maxlength="10"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
                        </div>
                        
                        <!-- Ngày Sinh -->
                        <div>
                            <label for="ngaySinh" class="block text-sm font-medium text-gray-700 mb-1">Ngày Sinh</label>
                            <input type="date" id="ngaySinh" th:field="*{ngaySinh}" 
                                th:value="${editLecturer?.ngaySinh != null} ? ${#temporals.format(editLecturer.ngaySinh, 'yyyy-MM-dd')} : ''" required
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
                        </div>
                        
                        <!-- Email -->
                        <div>
                            <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                            <input type="email" id="email" th:field="*{email}"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
                        </div>
                        
                        <!-- Học Vị -->
                        <div>
                            <label for="hocVi" class="block text-sm font-medium text-gray-700 mb-1">Học Vị</label>
                            <select id="hocVi" th:field="*{hocVi}" 
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
                                <option value="">-- Chọn học vị --</option>
                                <option value="Thạc sĩ" th:selected="${editLecturer?.hocVi == 'Thạc sĩ'}">Thạc sĩ</option>
                                <option value="Tiến sĩ" th:selected="${editLecturer?.hocVi == 'Tiến sĩ'}">Tiến sĩ</option>
                                <option value="Giáo sư" th:selected="${editLecturer?.hocVi == 'Giáo sư'}">Giáo sư</option>
                                <option value="Phó giáo sư" th:selected="${editLecturer?.hocVi == 'Phó giáo sư'}">Phó giáo sư</option>
                            </select>
                        </div>
                        
                        <!-- Khoa -->
                        <div>
                            <label for="maKhoa" class="block text-sm font-medium text-gray-700 mb-1">Khoa</label>
                            <select id="maKhoa" th:field="*{khoa.maKhoa}" required
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
                                <option value="">-- Chọn khoa --</option>
                                <option th:each="khoa : ${listKhoa}" 
                                        th:value="${khoa.maKhoa}"
                                        th:text="${khoa.tenKhoa}">
                                </option>
                            </select>
                        </div>
                        
                        <!-- Mã TK -->
                        <div>
                            <label for="maTK" class="block text-sm font-medium text-gray-700 mb-1">Mã TK (tùy chọn)</label>
                            <input type="text" id="maTK" th:field="*{taiKhoan.maTK}"
                                placeholder="Để trống nếu chưa có tài khoản"
                                class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500 text-gray-900">
                        </div>

                    </form>
                    <div class="flex justify-end border-t px-6 py-4 gap-3">
                        <button type="button" id="cancelBtn" 
                                class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                            Hủy
                        </button>
                        <button type="submit" form="lecturerForm" 
                                class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                            <span th:text="${editLecturer?.maGV != null} ? 'Cập nhật' : 'Thêm mới'"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{admin/layout/footer :: footer}" id="footer-include"></div>
    <script th:inline="javascript">
        /*<![CDATA[*/
        // Sử dụng biến showEditModal thay vì kiểm tra editLecturer
        let showEditModal = /*[[${showEditModal}]]*/ false;
        let isEditMode = /*[[${editLecturer?.maGV != null}]]*/ false;
    
        document.addEventListener("DOMContentLoaded", function () {
            const modal = document.getElementById("lecturerModal");
    
            // Nếu cần hiển thị modal chỉnh sửa
            if (showEditModal === true) {
                modal.classList.remove("hidden");
                if (isEditMode) {
                document.getElementById("modalTitle").textContent = "Sửa thông tin giảng viên";
                } else {
                    document.getElementById("modalTitle").textContent = "Thêm giảng viên";
                }
            }
    
            // Mở modal khi bấm nút "Thêm giảng viên"
            const addBtn = document.getElementById("addBtn");
            if (addBtn) {
                addBtn.addEventListener("click", function () {
                    // Nút này giờ nên là link đến /lecturers/new
                    // Không cần xử lý JavaScript nữa
                });
            }
    
            // Đóng modal khi bấm ra ngoài
            modal.addEventListener("click", function (e) {
                if (e.target === modal) {
                    modal.classList.add("hidden");
                }
            });
    
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") {
                    modal.classList.add("hidden");
                }
            });
    
            // Đóng modal khi bấm nút đóng
            const closeModal = document.getElementById("closeModal");
            if (closeModal) {
                closeModal.addEventListener("click", function () {
                    modal.classList.add("hidden");
                });
            }
    
            // Đóng modal khi bấm nút hủy
            const cancelBtn = document.getElementById("cancelBtn");
            if (cancelBtn) {
                cancelBtn.addEventListener("click", function () {
                    modal.classList.add("hidden");
                });
            }

            // Auto-uppercase cho mã GV
            const maGVInput = document.getElementById("maGV");
            if (maGVInput) {
                maGVInput.addEventListener("input", function (e) {
                    e.target.value = e.target.value.toUpperCase();
                });
            }

            // Auto-uppercase cho mã TK
            const maTKInput = document.getElementById("maTK");
            if (maTKInput) {
                maTKInput.addEventListener("input", function (e) {
                    e.target.value = e.target.value.toUpperCase();
                });
            }

            // Validation cho số điện thoại
            const soDTInput = document.getElementById("soDT");
            if (soDTInput) {
                soDTInput.addEventListener("input", function (e) {
                    const value = e.target.value;
                    const phonePattern = /^0\d{9}$/;
                    
                    // Chỉ cho phép nhập số
                    e.target.value = value.replace(/[^0-9]/g, '');
                    
                    // Kiểm tra pattern và hiển thị thông báo
                    if (e.target.value.length > 0) {
                        if (!phonePattern.test(e.target.value)) {
                            e.target.setCustomValidity("Số điện thoại phải bắt đầu bằng số 0 và có đúng 10 chữ số");
                            e.target.classList.add("border-red-500");
                            e.target.classList.remove("border-gray-300");
                        } else {
                            e.target.setCustomValidity("");
                            e.target.classList.remove("border-red-500");
                            e.target.classList.add("border-gray-300");
                        }
                    } else {
                        e.target.setCustomValidity("");
                        e.target.classList.remove("border-red-500");
                        e.target.classList.add("border-gray-300");
                    }
                });
                
                // Validation khi blur (rời khỏi trường)
                soDTInput.addEventListener("blur", function (e) {
                    const value = e.target.value;
                    const phonePattern = /^0\d{9}$/;
                    
                    if (value.length > 0 && !phonePattern.test(value)) {
                        e.target.setCustomValidity("Số điện thoại phải bắt đầu bằng số 0 và có đúng 10 chữ số");
                        e.target.reportValidity();
                    }
                });
            }
        });
        /*]]>*/
    </script>

    <script th:src="@{/admin/vendor/global/global.min.js}"></script>
    <script th:src="@{/admin/js/quixnav-init.js}"></script>
    <script th:src="@{/admin/js/custom.min.js}"></script>
</body>
</html>
