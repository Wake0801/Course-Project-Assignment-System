<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý nhóm</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" type="image/png" sizes="16x16" th:href="@{/admin/images/favicon.png}" />
    <link rel="stylesheet" th:href="@{/admin/vendor/owl-carousel/css/owl.carousel.min.css}" />
    <link rel="stylesheet" th:href="@{/admin/vendor/owl-carousel/css/owl.theme.default.min.css}" />
    <link th:href="@{/admin/vendor/jqvmap/css/jqvmap.min.css}" rel="stylesheet" />
    <link th:href="@{/admin/css/style.css}" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .table-container::-webkit-scrollbar {
            height: 8px;
        }
        .table-container::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        .table-container::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }
        .table-container::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
        .layout {
            display: flex;
            min-height: calc(100vh - 5rem);
            margin-top: 5rem;
            position: relative;
        }
        .group-member-warning {
            color: #e53e3e;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }
    </style>
</head>

<body class="bg-gray-50 font-sans">
    <div th:replace="~{admin/layout/header :: header}" id="header-include"></div>
    <div class="layout flex">
        <div th:replace="~{admin/layout/sidebar :: sidebar}" id="sidebar-include"></div>
        <div class="flex-1 ml-[17.1875rem] p-4">
            <div class="container mx-auto px-4 py-8 bg-white rounded-lg shadow-sm">
                <h1 class="text-3xl font-bold text-gray-800 mb-8 text-center">Quản lý nhóm</h1>
                
                <!-- Success and Error Messages -->
                <div th:if="${success}" class="mb-4 p-4 bg-green-100 border border-green-400 text-green-700 rounded-lg">
                    <span th:text="${success}"></span>
                </div>
                <div th:if="${error}" class="mb-4 p-4 bg-red-100 border border-red-400 text-red-700 rounded-lg">
                    <span th:text="${error}"></span>
                </div>

                <!-- Controls section -->
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
                    <a href="/groups/new" id="addGroupBtn" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg shadow-md transition duration-300 flex items-center gap-2">
                        <i class="fas fa-plus"></i>
                        <span>Thêm nhóm</span>
                    </a>

                    <div class="flex flex-col md:flex-row gap-4 w-full md:w-auto">
                        <!-- Search input -->
                        <div class="relative flex-grow">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i class="fas fa-search text-gray-400"></i>
                            </div>
                            <form th:action="@{/groups}" method="get" class="flex gap-2">
                                <input type="text" name="searchKeyword" placeholder="Tìm kiếm nhóm..." 
                                    th:value="${searchKeyword}"
                                    class="pl-10 pr-4 py-2 border rounded-md w-full md:w-64 focus:ring-blue-500 focus:border-blue-500" />
                                <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700">
                                    Tìm
                                </button>
                            </form>
                        </div>

                        <!-- Rows per page selector -->
                        <div class="flex items-center gap-2">
                            <label for="size" class="text-gray-600 whitespace-nowrap">Hiển thị:</label>
                            <form th:action="@{/groups}" method="get" class="ml-4">
                                <select name="size" onchange="this.form.submit()" class="border rounded-md px-2 py-1">
                                    <option th:selected="${size==10}" value="10">10</option>
                                    <option th:selected="${size==30}" value="30">30</option>
                                    <option th:selected="${size==50}" value="50">50</option>
                                    <option th:selected="${size==100}" value="100">100</option>
                                </select>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Table container -->
                <div class="table-container overflow-x-auto bg-white rounded-lg shadow-md border border-gray-200">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    STT
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Mã Nhóm
                                </th>
                                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Tên Nhóm
                                </th>
                                <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Số Thành Viên Hiện Tại
                                </th>
                                <th scope="col" class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Sĩ Số Tối Đa
                                </th>
                                <th scope="col" class="px-6 py-3 text-right text-xs font-medium text-gray-500 uppercase tracking-wider">
                                    Thao tác
                                </th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            <tr th:each="nhom, iterStat : ${ListGroups}" class="hover:bg-gray-50">
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500" th:text="${iterStat.count}">1</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${nhom.maNhom}">NHOM001</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900" th:text="${nhom.tenNhom}">Nhóm 1</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center" th:text="${nhom.soThanhVienHienTai}">0</td>
                                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 text-center" th:text="${nhom.soLuongTVToiDa}">4</td>
                                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                                    <a th:href="@{'/groups/edit/' + ${nhom.maNhom}}" class="text-blue-600 hover:text-blue-900 mr-3">Sửa</a>
                                    <a th:href="@{'/groups/delete/' + ${nhom.maNhom}}" 
                                       onclick="return confirm('Bạn chắc chắn muốn xóa nhóm này?')"
                                       class="text-red-600 hover:text-red-900">Xóa</a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <!-- Pagination -->
                <div class="mt-6 flex justify-center gap-2">
                    <a th:if="${currentPage > 1}" 
                       th:href="@{/groups(page=${currentPage - 1}, size=${size}, searchKeyword=${searchKeyword})}"
                       class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition">
                        Trước
                    </a>

                    <a th:each="i : ${#numbers.sequence(1, totalPages)}"
                       th:href="@{/groups(page=${i}, size=${size}, searchKeyword=${searchKeyword})}"
                       th:text="${i}"
                       th:classappend="${i == currentPage} ? 'bg-blue-600 text-white border-blue-600' : 'bg-white text-blue-600 border-gray-300'"
                       class="px-4 py-2 border rounded-md text-sm font-medium hover:bg-blue-100 transition">
                    </a>

                    <a th:if="${currentPage < totalPages}" 
                       th:href="@{/groups(page=${currentPage + 1}, size=${size}, searchKeyword=${searchKeyword})}"
                       class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-100 transition">
                        Sau
                    </a>
                </div>

                <!-- Modal for Add/Edit -->
                <div id="groupModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 flex items-center justify-center hidden">
                    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg">
                        <div class="flex justify-between items-center border-b px-6 py-4">
                            <h3 id="modalTitle" class="text-xl font-semibold text-gray-800">Thêm nhóm</h3>
                            <button id="closeModal" class="text-gray-400 hover:text-gray-500">
                                <i class="fas fa-times"></i>
                            </button>
                        </div>
                        <div class="p-6">
                            <form id="groupForm" th:action="@{/groups/save}" th:object="${editNhom}" method="post" class="space-y-4">
                                <!-- Giữ trường mã nhóm nhưng ẩn đi -->
                                <input type="hidden" th:field="*{maNhom}" />

                                <div>
                                    <label for="tenNhom" class="block text-sm font-medium text-gray-700 mb-1">Tên Nhóm</label>
                                    <input type="text" id="tenNhom" th:field="*{tenNhom}" required
                                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500">
                                </div>

                                <div>
                                    <label for="soLuongTVToiDa" class="block text-sm font-medium text-gray-700 mb-1">Số lượng thành viên tối đa</label>
                                    <input type="number" id="soLuongTVToiDa" th:field="*{soLuongTVToiDa}" required min="1"
                                        class="w-full border border-gray-300 rounded-md px-3 py-2 focus:ring-blue-500 focus:border-blue-500"
                                        oninput="validateMaxMembers(this)">
                                    <p id="maxMembersWarning" class="group-member-warning hidden">
                                        Số lượng thành viên tối đa phải lớn hơn hoặc bằng số thành viên hiện tại
                                    </p>
                                </div>

                                <div class="flex justify-end pt-4 border-t gap-3">
                                    <button type="button" id="cancelBtn"
                                            class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                                        Hủy
                                    </button>
                                    <button type="submit"
                                            class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700">
                                        <span th:text="${editNhom?.maNhom != null} ? 'Cập nhật' : 'Thêm mới'">Thêm mới</span>
                                    </button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/layout/footer :: footer}" id="footer-include"></div>

    <script th:src="@{/admin/vendor/global/global.min.js}"></script>
    <script th:src="@{/admin/js/quixnav-init.js}"></script>
    <script th:src="@{/admin/js/custom.min.js}"></script>

    <script th:inline="javascript">
        /*<![CDATA[*/
        let showEditModal = /*[[${showEditModal}]]*/ false;
        let isEditMode = /*[[${editNhom?.maNhom != null}]]*/ false;
        let currentMembers = /*[[${editNhom.soThanhVienHienTai}]]*/ 0;

        function validateMaxMembers(input) {
            const warning = document.getElementById('maxMembersWarning');
            const submitBtn = document.querySelector('button[type="submit"]');

            if (parseInt(input.value) < currentMembers) {
                warning.classList.remove('hidden');
                submitBtn.disabled = true;
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                warning.classList.add('hidden');
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        document.addEventListener("DOMContentLoaded", function () {
            const modal = document.getElementById("groupModal");
            const closeModal = document.getElementById("closeModal");
            const cancelBtn = document.getElementById("cancelBtn");

            // Kiểm tra nếu cần hiển thị modal chỉnh sửa/thêm mới
            if (showEditModal === true) {
                modal.classList.remove("hidden");
                if (isEditMode) {
                    document.getElementById("modalTitle").textContent = "Sửa thông tin nhóm";
                } else {
                    document.getElementById("modalTitle").textContent = "Thêm nhóm mới";
                }
            }

            // Đóng modal khi bấm ra ngoài
            modal.addEventListener("click", function (e) {
                if (e.target === modal) {
                    modal.classList.add("hidden");
                }
            });

            // Đóng modal với phím ESC
            document.addEventListener("keydown", function (e) {
                if (e.key === "Escape") {
                    modal.classList.add("hidden");
                }
            });

            // Nút đóng modal
            if (closeModal) {
                closeModal.addEventListener("click", function () {
                    modal.classList.add("hidden");
                });
            }

            // Nút hủy
            if (cancelBtn) {
                cancelBtn.addEventListener("click", function () {
                    modal.classList.add("hidden");
                });
            }
        });
        /*]]>*/
    </script>
</body>
</html>
